server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Load standard Nginx MIME types
    include /etc/nginx/mime.types;

    # Ensure correct MIME type for PWA webmanifest
    types {
        application/manifest+json webmanifest;
    }

    # Enable Gzip compression for performance on VPS
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml
        application/json
        image/svg+xml;

    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service Worker & Manifest:
    # Never cache so PWA updates take effect immediately
    location ~* (sw\.js|manifest\.webmanifest|registerSW\.js|workbox-.*\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static Vite Assets:
    # Immutable long-term caching
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Routing:
    # Send unknown frontend routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fallback for server errors
    error_page 500 502 503 504 /index.html;
}