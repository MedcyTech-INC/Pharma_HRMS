server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Load standard Nginx MIME types
    include /etc/nginx/mime.types;

    # Ensure correct MIME type for PWA webmanifest
    types {
        application/manifest+json webmanifest;
    }

    # Enable Gzip compression for performance on VPS
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml
        application/json
        image/svg+xml;

    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service Worker & Manifest:
    # Never cache so PWA updates take effect immediately
    location ~* (sw\.js|manifest\.webmanifest|registerSW\.js|workbox-.*\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static Vite Assets:
    # Immutable long-term caching
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Docker internal DNS resolver (allows Nginx to start even if backend container is booting)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API Reverse Proxy:
    # Forward all /api/ requests to the FastAPI backend service
    location /api/ {
        set $backend_api http://backend:8000;
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # WebSocket Proxy:
    # Forward live socket connections to backend
    location /socket.io/ {
        set $backend_ws http://backend:8000;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # SPA Routing:
    # Send unknown frontend routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fallback for server errors
    error_page 500 502 503 504 /index.html;
}