services:
  # Frontend (Static PWA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      gunicorn app.main:sio_app
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --timeout 120
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hrms:${DB_PASSWORD:-password}@postgres:5432/pharma_hrms
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_secret}
      SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      SUPABASE_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:16-3.4-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: pharma_hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "9590:80"
      - "443:443"
    # Note: Nginx config needs to be updated to route /api to backend and / to frontend
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
