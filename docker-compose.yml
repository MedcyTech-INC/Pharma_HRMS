services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_COMPANY_NAME: ${VITE_COMPANY_NAME:-Orca Labs}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Orca Labs Pharma HRMS}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_MAP_DEFAULT_LAT: ${VITE_MAP_DEFAULT_LAT:-17.3850}
        VITE_MAP_DEFAULT_LNG: ${VITE_MAP_DEFAULT_LNG:-78.4867}
        VITE_MAP_DEFAULT_ZOOM: ${VITE_MAP_DEFAULT_ZOOM:-12}
        VITE_OSRM_ENDPOINT: ${VITE_OSRM_ENDPOINT:-https://router.project-osrm.org}
        VITE_LIVE_BROADCAST_INTERVAL_MS: ${VITE_LIVE_BROADCAST_INTERVAL_MS:-10000}
    container_name: pharma_hrms_frontend
    restart: unless-stopped
    ports:
      # Maps host port (default 9590, configurable via .env) to internal Nginx port 80
      - "${FRONTEND_PORT:-9590}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
