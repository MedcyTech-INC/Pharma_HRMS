services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharma_hrms_backend
    restart: unless-stopped
    ports:
      # Maps host port (default 8085 to avoid common 80, 443, 3000, 8000, 8080) to container port 8000
      - "${APP_PORT:-8085}:8000"
    env_file:
      - .env
    extra_hosts:
      # Allows the container to access databases or services running directly on the VPS host via 'host.docker.internal'
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pharma_network

  # Optional local Redis service (starts when running with --profile with-db or uncommented)
  redis:
    image: redis:7-alpine
    container_name: pharma_hrms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    profiles:
      - with-db
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pharma_network

  # Optional local PostgreSQL service with UUID/PostGIS (starts when running with --profile with-db)
  db:
    image: postgres:16-alpine
    container_name: pharma_hrms_db
    restart: unless-stopped
    profiles:
      - with-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pharma_hrms}
      POSTGRES_USER: ${DB_USER:-hrms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - pharma_network

volumes:
  redis_data:
  pgdata:

networks:
  pharma_network:
    driver: bridge
